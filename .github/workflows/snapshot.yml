name: snapshot

on:
  schedule:
    # 05:17, 11:17, 17:17, 23:17 UTC
    - cron: "17 5,11,17,23 * * *"
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  # Pushes to main (merges) must pass the test suite before snapshotting.
  # Scheduled runs use code that already passed, so they skip it.
  tests:
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/tests.yml

  snapshot:
    needs: tests
    # Run when tests passed, or were skipped (scheduled run).
    if: ${{ !cancelled() && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Worst case: every file times out on all 5 attempts (~27 min).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch previous bundle manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tsm_snapshot.py fetch-previous --dest prev

      # Runs even if fetch-previous crashed; a missing status is treated as a
      # failed lookup (upload full set, fail the run).
      - name: Snapshot
        id: snapshot
        if: ${{ !cancelled() }}
        run: python3 tsm_snapshot.py snapshot --out out --previous prev

      # Runs even when the snapshot step failed (partial run / lookup failure);
      # the script decides whether there is anything to upload.
      - name: Upload bundle
        if: ${{ !cancelled() && steps.snapshot.outputs.upload == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.snapshot.outputs.bundle_name }}
          path: ${{ steps.snapshot.outputs.bundle_path }}
          retention-days: 36
          compression-level: 0
          if-no-files-found: error
