name: tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  autest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: autest -D tests --sandbox "$RUNNER_TEMP/autest"
