name: tests

on:
  pull_request:
  # Also called by snapshot.yml so a push to main is tested before it snapshots.
  workflow_call:

permissions:
  contents: read

jobs:
  autest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # Keep serial: parallel (-j) runs can report "Unknown" and exit 0.
      - run: autest -D tests --sandbox "$RUNNER_TEMP/autest"
